      second_path:
      - cloud-native / service-communication
      extra:
        annotations:
          site-id: apache-dubbo
          site-name: Apache Dubbo
    - name: apache-brpc
      homepage_url: https://brpc.apache.org/
      logo: apache-brpc.png
