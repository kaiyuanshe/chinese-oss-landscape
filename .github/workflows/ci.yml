name: CI

on:
  merge_group:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test-cli-tool:
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- --deny warnings
      - name: Run rustfmt
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked
      - name: Validate site content and configuration
        run: npm run validate
      - name: Build the complete static site
        run: npm run build

  lint-and-test-webapp:
    runs-on:
      labels: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies for all tested packages
        run: |
          for package in common embed-item webapp; do
            yarn --cwd "ui/$package" install --frozen-lockfile --network-concurrency 1
          done
      - name: Test site output replacement
        run: npm run test:site
      - name: Run prettier
        working-directory: ./ui/webapp
        run: yarn format:diff
      - name: Run eslint
        working-directory: ./ui/webapp
        run: yarn lint
      - name: Run tests
        working-directory: ./ui/webapp
        run: yarn test

  lint-common:
    runs-on:
      labels: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        working-directory: ./ui/common
        run: yarn install --frozen-lockfile --network-concurrency 1
      - name: Run prettier
        working-directory: ./ui/common
        run: yarn format:diff
      - name: Run eslint
        working-directory: ./ui/common
        run: yarn lint

  lint-and-test-embed:
    runs-on:
      labels: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        working-directory: ./ui/embed
        run: yarn install --frozen-lockfile --network-concurrency 1
      - name: Run prettier
        working-directory: ./ui/embed
        run: yarn format:diff
      - name: Run eslint
        working-directory: ./ui/embed
        run: yarn lint

  lint-embed-item:
    runs-on:
      labels: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        working-directory: ./ui/embed-item
        run: yarn install --frozen-lockfile --network-concurrency 1
      - name: Run prettier
        working-directory: ./ui/embed-item
        run: yarn format:diff
      - name: Run eslint
        working-directory: ./ui/embed-item
        run: yarn lint

  build-cli-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build the CLI image without publishing
        run: docker build -f crates/cli/Dockerfile -t landscape2-ci .
