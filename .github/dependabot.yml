version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"
    # Keep minor/major migrations separate, including breaking 0.x minor releases.
    groups:
      rust-patches:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      - dependency-name: "markdown"
      - dependency-name: "usvg"
      - dependency-name: "rand"
        versions: [">=0.9"]
      # octorust 0.10 uses this client/middleware pair.
      - dependency-name: "reqwest"
        versions: [">=0.13"]
      - dependency-name: "reqwest-middleware"
        versions: [">=0.5"]

  - package-ecosystem: "docker"
    directory: "/crates/cli"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directories:
      - "/ui/webapp"
      - "/ui/common"
      - "/ui/embed"
      - "/ui/embed-item"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"
    groups:
      frontend-patches:
        patterns: ["*"]
        update-types: ["patch"]
