[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core"
]

[workspace.package]
version = "1.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.96.1"
authors = ["Sergio Castaño Arteaga", "Cintia Sanchez Garcia"]
homepage = "https://github.com/cncf/landscape2"

[workspace.dependencies]
anyhow = "1.0.104"
askama = { version = "0.16.1", features = ["serde_json"] }
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
cached = { version = "2.0.2", default-features = false, features = ["async", "proc_macro"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
deadpool = "0.13.1"
dirs = "7.0.0"
futures = "0.3.34"
headless_chrome = "1.0.22"
hex = "0.4.3"
imagesize = "0.15.0"
itertools = "0.15.0"
leaky-bucket = "1.1.2"
markdown = "1.0.0"
mockall = "0.15.0"
mockito = "1.7.2"
num_cpus = "1.17.0"
octorust = "0.10.0"
parse_link_header = "0.4.1"
pretty_assertions = "1.4.1"
qrcode = "0.14.1"
rand = "0.8.5" # do-not-upgrade
regex = "1.13.1"
reqwest = { version = "0.12.28", features = ["json",  "multipart", "native-tls-vendored"] } # do-not-upgrade
reqwest-middleware = "0.4.2" # do-not-upgrade
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
url = "2.5.8"
usvg = "0.37.0" # do-not-upgrade
which = "8.0.6"

[profile.release]
lto = true
