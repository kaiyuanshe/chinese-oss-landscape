      '云原生': { color: '#06b6d4', x: -220, y: -130, r: 36 },
      '大数据': { color: '#3b82f6', x: 200, y: -140, r: 36 },
      '云计算': { color: '#6366f1', x: -230, y: 120, r: 34 },
      '数据库': { color: '#8b5cf6', x: 220, y: 110, r: 34 },
      '开源布道': { color: '#ec4899', x: 0, y: -200, r: 32 },
      '机器学习': { color: '#10b981', x: -110, y: -20, r: 32 },
      '中间件': { color: '#f59e0b', x: 110, y: -15, r: 32 },
      '开源教育': { color: '#eab308', x: 0, y: 200, r: 30 },
      '社区': { color: '#14b8a6', x: -110, y: 200, r: 30 },
      '赞助伙伴': { color: '#f43f5e', x: 110, y: 200, r: 32 },
      '其他': { color: '#94a3b8', x: 0, y: 0, r: 26 }
    };

    const clusterStars = [];
    Object.keys(CLUSTER_CONFIG).forEach(dom => {
      const c = CLUSTER_CONFIG[dom];
      clusterStars.push({
        name: dom,
        domain: dom,
        color: c.color,
        baseX: c.x,
        baseY: c.y,
        x: c.x,
        y: c.y,
        radius: c.r
      });
    });

    const nodes = [];
    RAW_DATA.forEach((item, idx) => {
      let dom = item.domain;
      if (!CLUSTER_CONFIG[dom]) {
        dom = item.type === '社区' ? '社区' : (item.tier && item.tier.includes('赞助') ? '赞助伙伴' : '其他');
      }
      const star = clusterStars.find(s => s.domain === dom) || clusterStars[clusterStars.length - 1];
      const angle = (idx * 1.37) % (Math.PI * 2);
      const dist = 30 + ((idx * 21) % 110);

      let baseR = 5.5;
      let haloColor = null;
      if (item.tier_level === 'platinum') {
        baseR = 12;
        haloColor = '#f59e0b';
      } else if (item.tier_level === 'gold') {
        baseR = 9.5;
        haloColor = '#fbbf24';
      } else if (item.tier_level === 'foundation') {
        baseR = 8.5;
        haloColor = '#c084fc';
      } else if (item.tier_level === 'silver') {
        baseR = 7;
      }

      nodes.push({
        id: 'node_' + idx,
        name: item.name,
        type: item.type,
        domain: item.domain,
        clusterDomain: dom,
        tags: item.tags || [],
        city: item.city || '',
        link: item.link || '',
        tier: item.tier || 'project',
        tier_level: item.tier_level || 'community',
        last_year: item.last_year || null,
        star: star,
        color: CLUSTER_CONFIG[dom].color,
        haloColor: haloColor,
        x: star.baseX + Math.cos(angle) * dist,
        y: star.baseY + Math.sin(angle) * dist,
        baseDist: dist,
        baseAngle: angle,
        radius: baseR,
        highlighted: true,
        spotlight: false
      });
    });

    // Camera and Interaction
    let camera = {
      x: width / 2,
      y: height / 2,
      zoom: 0.72,
      targetX: width / 2,
      targetY: height / 2,
      targetZoom: 0.72
    };

    let hoveredNode = null;
    let selectedNode = null;
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left - camera.x) / camera.zoom;
      const my = (e.clientY - rect.top - camera.y) / camera.zoom;

      let found = null;
      for (let n of nodes) {
        const dx = n.x - mx;
        const dy = n.y - my;
        if (dx * dx + dy * dy < (n.radius + 8) * (n.radius + 8)) {
          found = n;
          break;
        }
      }
      if (found) {
        focusNode(found);
        return;
      }
      isDragging = true;
      dragStartX = e.clientX - camera.x;
      dragStartY = e.clientY - camera.y;
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        camera.x = e.clientX - dragStartX;
        camera.y = e.clientY - dragStartY;
        camera.targetX = camera.x;
        camera.targetY = camera.y;
        return;
      }
      const rect = canvas.getBoundingClientRect();
      if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
        hoveredNode = null;
        return;
      }
      const mx = (e.clientX - rect.left - camera.x) / camera.zoom;
      const my = (e.clientY - rect.top - camera.y) / camera.zoom;
      let found = null;
      for (let n of nodes) {
        const dx = n.x - mx;
        const dy = n.y - my;
        if (dx * dx + dy * dy < (n.radius + 8) * (n.radius + 8)) {
          found = n;
          break;
        }
      }
      hoveredNode = found;
      canvas.style.cursor = hoveredNode ? 'pointer' : (isDragging ? 'grabbing' : 'default');
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.88;
      const newZoom = Math.max(0.25, Math.min(2.8, camera.targetZoom * zoomFactor));
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      camera.targetX = mouseX - (mouseX - camera.targetX) * (newZoom / camera.targetZoom);
      camera.targetY = mouseY - (mouseY - camera.targetY) * (newZoom / camera.targetZoom);
      camera.targetZoom = newZoom;
    }, { passive: false });

    function focusNode(node) {
      selectedNode = node;
      camera.targetX = width / 2 - node.x * 1.35;
      camera.targetY = height / 2 - node.y * 1.35;
      camera.targetZoom = 1.35;

      const bar = document.getElementById('nodeDetailBar');
      bar.classList.remove('hidden');
      document.getElementById('detailName').innerText = node.name;
      document.getElementById('detailTier').innerText = node.tier && node.tier !== 'project' ? node.tier : (node.tier_level === 'foundation' ? '基金会/院所' : (node.tier_level === 'enterprise' ? '企业伙伴' : '开源社区'));
      document.getElementById('detailDesc').innerText = `${node.domain} · ${node.city || '全球协作'} ${node.last_year ? '· 最近赞助: ' + node.last_year + '年' : ''}`;
      const link = document.getElementById('detailLink');
      link.href = node.link && node.link.startsWith('http') ? node.link : 'https://www.google.com/search?q=' + encodeURIComponent(node.name + ' 开源');

      highlightGridItem(node.name);
    }

    document.getElementById('resetViewBtn').addEventListener('click', () => {
      camera.targetX = width / 2;
      camera.targetY = height / 2;
      camera.targetZoom = 0.72;
      selectedNode = null;
      nodes.forEach(n => { n.spotlight = false; n.highlighted = true; });
      document.getElementById('nodeDetailBar').classList.add('hidden');
      document.getElementById('spotlightStatus').innerText = '';
      renderGrid(nodes);
    });

    // Physics
    let time = 0;
    function updatePhysics() {
      time += 0.005;
      camera.x += (camera.targetX - camera.x) * 0.1;
      camera.y += (camera.targetY - camera.y) * 0.1;
      camera.zoom += (camera.targetZoom - camera.zoom) * 0.1;

      clusterStars.forEach((star, idx) => {
        star.x = star.baseX + Math.sin(time + idx) * 2.5;
        star.y = star.baseY + Math.cos(time + idx) * 2.5;
      });

      nodes.forEach((n, idx) => {
        const targetX = n.star.x + Math.cos(n.baseAngle + Math.sin(time * 0.4 + idx * 0.1) * 0.06) * n.baseDist;
        const targetY = n.star.y + Math.sin(n.baseAngle + Math.sin(time * 0.4 + idx * 0.1) * 0.06) * n.baseDist;
        n.x += (targetX - n.x) * 0.05;
        n.y += (targetY - n.y) * 0.05;
      });
    }

    // Render Canvas
    function render() {
      ctx.clearRect(0, 0, width, height);
      ctx.save();
      ctx.translate(camera.x, camera.y);
      ctx.scale(camera.zoom, camera.zoom);

      // Subtle background grid
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.03)';
      ctx.lineWidth = 1;
      for (let r = 120; r <= 500; r += 120) {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Render Cluster Stars
      clusterStars.forEach(star => {
        const grad = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, star.radius * 2);
        grad.addColorStop(0, star.color + '55');
        grad.addColorStop(0.6, star.color + '15');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius * 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = star.color;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius * 0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(star.name, star.x, star.y + 4);
      });

      // Connections
      ctx.lineWidth = 0.5;
      nodes.forEach(n => {
        if (n.spotlight || n === hoveredNode || n === selectedNode) {
          ctx.strokeStyle = n.color + '44';
          ctx.beginPath();
          ctx.moveTo(n.star.x, n.star.y);
          ctx.lineTo(n.x, n.y);
          ctx.stroke();
        }
      });

      // Render Nodes
      const hasSpotlight = nodes.some(n => n.spotlight);
      nodes.forEach(n => {
        const isFocus = (n === hoveredNode || n === selectedNode);
        const isTarget = n.spotlight || isFocus;
        const alpha = hasSpotlight ? (isTarget ? 1.0 : 0.12) : 0.85;

        ctx.fillStyle = n.color;
        ctx.globalAlpha = alpha;

        if (isTarget) {
          ctx.shadowColor = n.haloColor || n.color;
          ctx.shadowBlur = 16;
        } else {
          ctx.shadowBlur = 0;
        }

        ctx.beginPath();
        ctx.arc(n.x, n.y, isTarget ? n.radius + 3 : n.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;

        if (isFocus) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius + 6, 0, Math.PI * 2);
          ctx.stroke();
        }

        const shouldShowLabel = isFocus || n.spotlight || (n.tier_level === 'platinum' && !hasSpotlight);

        if (shouldShowLabel) {
          ctx.fillStyle = isTarget ? '#38bdf8' : (n.haloColor ? '#fef08a' : '#e2e8f0');
          ctx.font = (isTarget ? 'bold 11px' : '10px') + ' sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(n.name, n.x, n.y + n.radius + 12);
        }
      });

      ctx.restore();
    }

    function animate() {
      updatePhysics();
      render();
      requestAnimationFrame(animate);
    }
    animate();

    // ==================== CNCF GRID VIEW RENDERING ====================
    const gridContainer = document.getElementById('gridContainer');
    const gridMatchBadge = document.getElementById('gridMatchBadge');

    function renderGrid(activeNodes) {
      gridContainer.innerHTML = '';
      gridMatchBadge.innerText = `匹配 ${activeNodes.length}`;

      const groups = {};
      activeNodes.forEach(n => {
        const dom = n.clusterDomain || '其他';
        if (!groups[dom]) groups[dom] = [];
        groups[dom].push(n);
      });

      const domainKeys = Object.keys(groups);
      if (domainKeys.length === 0) {
        gridContainer.innerHTML = `<div class="p-4 text-center text-gray-500 text-xs">没有匹配的项目</div>`;
        return;
      }

      domainKeys.forEach(dom => {
        const list = groups[dom];
        const cardBox = document.createElement('div');
        cardBox.className = 'p-2.5 rounded-xl bg-slate-950/70 border border-gray-800';
        
        const catColor = CLUSTER_CONFIG[dom] ? CLUSTER_CONFIG[dom].color : '#38bdf8';
        cardBox.innerHTML = `
          <div class="flex items-center justify-between pb-1.5 mb-2 border-b border-gray-800/80">
            <span class="text-[11px] font-bold text-gray-200 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full" style="background-color: ${catColor}"></span>
              <span>${dom}</span>
            </span>
            <span class="text-[10px] text-gray-400 font-mono">${list.length}</span>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
            ${list.map(n => `
              <div id="grid_card_${n.id}" onclick="spotlightSingle('${n.name}')" class="p-1.5 rounded-lg bg-gray-800/80 hover:bg-cyan-500/20 border border-gray-700/60 hover:border-cyan-400/50 cursor-pointer transition flex flex-col justify-between group">
                <span class="text-[11px] font-medium text-gray-200 group-hover:text-cyan-300 truncate">${n.name}</span>
                <span class="text-[9px] text-gray-400 truncate mt-0.5">${n.tier !== 'project' ? n.tier : n.type}</span>
              </div>
            `).join('')}
          </div>
        `;
        gridContainer.appendChild(cardBox);
      });
    }

    function highlightGridItem(name) {
      document.querySelectorAll('[id^="grid_card_"]').forEach(el => {
        el.classList.remove('ring-2', 'ring-cyan-400', 'bg-cyan-500/20');
      });
      const targetNode = nodes.find(n => n.name === name);
      if (targetNode) {
        const el = document.getElementById(`grid_card_${targetNode.id}`);
        if (el) {
          el.classList.add('ring-2', 'ring-cyan-400', 'bg-cyan-500/20');
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }
    }

    renderGrid(nodes);

    // ==================== CHATBOT & QA ENGINE ====================
    const chatMessagesContainer = document.getElementById('chatMessagesContainer');
    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const clearBtn = document.getElementById('clearBtn');

    userInput.addEventListener('input', () => {
      clearBtn.classList.toggle('hidden', !userInput.value);
    });
    clearBtn.addEventListener('click', () => {
      userInput.value = '';
      clearBtn.classList.add('hidden');
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const query = userInput.value.trim();
      if (!query) return;
      askQuestion(query);
      userInput.value = '';
      clearBtn.classList.add('hidden');
    });

    window.askQuestion = function(query) {
      chatMessagesContainer.classList.remove('hidden');
      appendUserMessage(query);
      setTimeout(() => {
        generateAnswer(query);
      }, 200);
    };

    function appendUserMessage(text) {
      const div = document.createElement('div');
      div.className = 'flex items-start justify-end gap-2';
      div.innerHTML = `
        <div class="chat-bubble-user px-3 py-1.5 rounded-2xl rounded-tr-none text-white max-w-[85%] shadow-md text-xs">
          <p>${text}</p>
        </div>
      `;
      chatMessages.appendChild(div);
      chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
    }

    function generateAnswer(query) {
      const originalQ = query.trim();
      const q = originalQ.toLowerCase();
      let matchedNodes = [];
      let replyHtml = '';

      // 1. Sponsorship (2024 / 2025)
      if (q.includes('2024') || q.includes('2025') || q.includes('赞助')) {

        const latestSponsors = matchedNodes.filter(n => n.last_year && n.last_year >= 2024);
        const sampleNames = latestSponsors.slice(0, 8).map(n => n.name).join('、');
        replyHtml = `
          <p class="font-semibold text-cyan-300 mb-1">🏆 2024-2025 年度赞助伙伴与生态支持单位</p>
          <p class="text-gray-200">持续支持开源生态发展的重点伙伴共有 <strong>${latestSponsors.length} 家</strong>（包含 <strong>${sampleNames}</strong> 等）。</p>

      else if (q.includes('中间件') || q.includes('消息队列') || q.includes('rpc') || q.includes('网关')) {

        const sampleNames = matchedNodes.slice(0, 8).map(n => n.name).join('、');
        replyHtml = `
          <p class="font-semibold text-amber-300 mb-1">⚙️ 中间件与基础架构赛道</p>
          <p class="text-gray-200">全景图中收录了 <strong>${matchedNodes.length} 个</strong> 消息中间件、API网关、微服务组件等代表性项目（包含 <strong>${sampleNames}</strong> 等）。</p>
          <p class="text-[11px] text-gray-400 mt-1.5 flex items-center gap-1.5">
            <i class="fa-solid fa-circle-info text-amber-400"></i>
            <span>下方左侧全景矩阵已同步筛选出该赛道的全部组织卡片，右侧星盘已聚光对应星宿，下拉即可浏览。</span>
          </p>
        `;
      }
      // 3. AI / 人工智能 / 机器学习 / MLOps
      else if (q.includes('ai') || q.includes('人工智能') || q.includes('机器学习') || q.includes('大模型') || q.includes('深度学习') || q.includes('mlops') || q.includes('算法')) {
        matchedNodes = nodes.filter(n => 
          n.clusterDomain === '机器学习' || 
          n.domain === '人工智能' || 
          n.domain === '机器学习' || 
          n.domain === 'MLOps' ||
          (n.tags && n.tags.some(t => {
            const tl = t.toLowerCase();
            return tl.includes('ai') || tl.includes('人工') || tl.includes('机器') || tl.includes('模型') || tl.includes('mlops');
          }))
        );
        const sampleNames = matchedNodes.slice(0, 8).map(n => n.name).join('、');
        replyHtml = `
          <p class="font-semibold text-emerald-300 mb-1">🤖 人工智能 (AI) 与机器学习生态领域</p>
          <p class="text-gray-200">中国开源地图收录了 <strong>${matchedNodes.length} 个</strong> AI/机器学习项目与社区（包含 <strong>${sampleNames}</strong> 等）。</p>
          <p class="text-[11px] text-gray-400 mt-1.5 flex items-center gap-1.5">
            <i class="fa-solid fa-circle-info text-emerald-400"></i>
            <span>下方左侧全景矩阵已完整筛选出该领域所有项目，右侧星盘已聚焦对应星系，下拉即可查看详情。</span>
          </p>
        `;
      }
      // 4. Cloud Native / Cloud
      else if (q.includes('云原生') || q.includes('云计算') || q.includes('k8s') || q.includes('kubernetes') || q.includes('容器')) {
        matchedNodes = nodes.filter(n => n.clusterDomain === '云原生' || n.clusterDomain === '云计算' || n.domain.includes('云') || (n.tags && n.tags.some(t => t.includes('云'))));
        const sampleNames = matchedNodes.slice(0, 8).map(n => n.name).join('、');
        replyHtml = `
          <p class="font-semibold text-cyan-300 mb-1">☁️ 云原生与云计算生态领域</p>
          <p class="text-gray-200">共收录 <strong>${matchedNodes.length} 个</strong> 代表性项目，涵盖容器、微服务、服务网格与基础设施（包含 <strong>${sampleNames}</strong> 等）。</p>
          <p class="text-[11px] text-gray-400 mt-1.5 flex items-center gap-1.5">
            <i class="fa-solid fa-circle-info text-cyan-400"></i>
            <span>下方矩阵已为您筛选出全部项目卡片，右侧星盘已同步聚光高亮，下拉即可浏览。</span>
          </p>
        `;
      } 
      // 5. Foundations / Universities
      else if (q.includes('基金会') || q.includes('高校') || q.includes('大学') || q.includes('院所') || q.includes('科研')) {
        matchedNodes = nodes.filter(n => n.tier_level === 'foundation' || n.type === '基金会' || n.type === '高校' || n.type === '科研院所');
        const sampleNames = matchedNodes.slice(0, 8).map(n => n.name).join('、');
        replyHtml = `
          <p class="font-semibold text-purple-300 mb-1">🏛️ 基金会、高校与科研机构</p>
          <p class="text-gray-200">代表性机构共 <strong>${matchedNodes.length} 个</strong>（包含 <strong>${sampleNames}</strong> 等）。</p>
          <p class="text-[11px] text-gray-400 mt-1.5 flex items-center gap-1.5">
            <i class="fa-solid fa-circle-info text-purple-400"></i>
            <span>下方左侧矩阵已列出全部学术与基金会组织，右侧星盘已同步展现，下拉即可查看。</span>
          </p>
        `;
      } 
      // 6. Database
      else if (q.includes('数据库') || q.includes('database') || q.includes('db') || q.includes('sql')) {
        matchedNodes = nodes.filter(n => n.clusterDomain === '数据库' || n.domain === '数据库' || (n.tags && n.tags.some(t => t.includes('数据'))));
        const sampleNames = matchedNodes.slice(0, 8).map(n => n.name).join('、');
        replyHtml = `
          <p class="font-semibold text-indigo-300 mb-1">💾 数据库赛道</p>
          <p class="text-gray-200">共匹配 <strong>${matchedNodes.length} 个项目</strong>，涵盖分布式、时序、分析型与图数据库等（包含 <strong>${sampleNames}</strong> 等）。</p>
          <p class="text-[11px] text-gray-400 mt-1.5 flex items-center gap-1.5">
            <i class="fa-solid fa-circle-info text-indigo-400"></i>
            <span>详细项目列表已在下方左侧矩阵卡片中呈现，右侧星盘已聚光定位，下拉即可浏览。</span>
          </p>
        `;
      }
      // 7. Operating System / Linux / OS
      else if (q.includes('操作系统') || q.includes('os') || q.includes('linux')) {
        matchedNodes = nodes.filter(n => n.domain === '操作系统' || (n.tags && n.tags.some(t => t.includes('系统') || t.includes('os'))));
        const sampleNames = matchedNodes.slice(0, 8).map(n => n.name).join('、');
        replyHtml = `
          <p class="font-semibold text-blue-300 mb-1">💻 操作系统领域</p>

      const el = document.getElementById('landscapeSection');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    window.spotlightSingle = function(name) {
      const target = nodes.find(n => n.name === name);
      if (target) {
        nodes.forEach(n => { n.spotlight = (n === target); });
        focusNode(target);
        document.getElementById('spotlightStatus').innerText = `已聚焦: ${target.name}`;
      }
    };
  </script>
</body>
</html>
